<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Cash Arena</title>
  <link rel="stylesheet" href="login.css">
  
  <!-- Scripts Publicitaires / Analytics -->
  <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
  <script type="text/javascript">
    aclib.runAutoTag({ zoneId: 'eggoze90yi' });
  </script>
</head>

<body>
<div class="gaming-bg"></div>
<div class="gaming-grid"></div>
<div class="gaming-glow"></div>

<!-- BARRE DE NAVIGATION CORRIGÉE ✅ -->
<nav class="main-navbar">
  <div class="nav-left">
    <a href="index.html" class="nav-logo">⚡ Cash Arena</a>
  </div>
  <div class="nav-right">
    <button class="btn-back" onclick="goHome()">⬅ Retour</button>
  </div>
</nav>

<!-- BOITE DE CONNEXION CENTRÉE -->
<div class="login-container">

  <div class="login-card">
    <h1>🔑 Connexion</h1>
    <p class="login-sub">Accède à ton espace de tournois Brawl Stars</p>

    <!-- Zone pour afficher les erreurs Firebase proprement (ex: Mauvais mot de passe) -->
    <div id="errorMessage" class="error-text" style="display:none; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; border: 1px solid #ef4444;"></div>

    <!-- Formulaire structuré -->
    <div class="login-form-group">
      <div class="input-field-wrapper" style="margin-bottom: 16px;">
        <label style="display:block; font-size:0.85rem; color:var(--text-sub); margin-bottom:6px; text-align:left;">Adresse Email</label>
        <input type="email" id="email" placeholder="exemple@mail.com" style="width:100%;">
      </div>

      <div class="input-field-wrapper" style="margin-bottom: 20px;">
        <label style="display:block; font-size:0.85rem; color:var(--text-sub); margin-bottom:6px; text-align:left;">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" style="width:100%; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; color: var(--text-main); font-size: 0.95rem; transition: var(--transition);">
      </div>

      <button class="btn-link" onclick="login()" style="width: 100%; justify-content: center; margin-bottom: 15px;">
        Se connecter
      </button>
    </div>

    <!-- Liens d'aide et d'inscription -->
    <div class="login-footer-links" style="margin-top: 15px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px;">
      <a href="#" onclick="forgotPassword()" style="color: var(--text-sub); text-decoration: none; transition: var(--transition);">Mot de passe oublié ?</a>
      <p style="color: var(--text-sub);">Pas encore de compte ? <a href="#" onclick="goToRegister()" style="color: var(--accent-green); text-decoration: none; font-weight: 700;">Créer un compte</a></p>
    </div>
  </div>

</div>

<!-- SCRIPTS FIREBASE ET CONFIGURATION -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="firebase.js"></script>
<script src="app.js"></script>

<script>
// Fonction utilitaire pour le bouton retour
function goHome() {
  window.location.href = "index.html";
}

// Emplacement pour tes futures fonctions si tu veux les rajouter dans la foulée
function forgotPassword() {
  const email = document.getElementById("email").value.trim();
  if(!email) {
    alert("Veuillez entrer votre adresse email pour réinitialiser votre mot de passe.");
    return;
  }
  auth.sendPasswordResetEmail(email)
    .then(() => alert("Email de réinitialisation envoyé ! Check tes spams."))
    .catch(err => alert("Erreur : " + err.message));
}

function goToRegister() {
  // Redirige vers ta page d'inscription si tu en as une (ex: register.html)
  window.location.href = "register.html"; 
}
</script>

<!-- Script d'analyses de performance Vercel -->
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

</body>
</html>
