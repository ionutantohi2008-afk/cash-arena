<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Profil - Cash Arena</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Scripts Publicitaires / Analytics -->
  <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
  <script type="text/javascript">
    aclib.runAutoTag({ zoneId: 'eggoze90yi' });
  </script>
</head>

<body>
<div class="gaming-bg"></div>
<div class="gaming-grid"></div>
<div class="gaming-glow"></div>

<!-- BARRE DE NAVIGATION OPTIMISÉE -->
<nav class="main-navbar">
  <div class="nav-left">
    <a href="index.html" class="nav-logo">🟢 Cash Arena</a>
  </div>
  <div class="nav-right">
    <button class="btn-back" onclick="goHome()">⬅ Retour</button>
  </div>
</nav>

<!-- CONTAINER PRINCIPAL DU PROFIL -->
<div class="profile-main-container">

  <!-- CARTE 1 : IDENTITÉ ET COMPTE (Gauche ou Haut) -->
  <div class="profile-sidebar-card">
    <div class="avatar-placeholder">👤</div>
    <h1 class="profile-title">Mon Profil</h1>
    <p class="login-sub">Gère ton compte Cash Arena</p>
    
    <div class="account-details">
      <p id="email" class="info-text"></p>
      <p id="balance" class="balance-text"></p>
    </div>

    <!-- ZONE PSEUDO (Formulaire & Affichage imbriqués proprement) -->
    <div id="pseudoSection" class="inner-section">
      <!-- FORMULAIRE DE CHOIX -->
      <div id="pseudoForm" class="pseudo-box">
        <h3>Choisir mon pseudo</h3>
        <div class="input-action-group">
          <input type="text" id="pseudoInput" placeholder="Ton pseudo">
          <button class="btn-save" onclick="savePseudo()">Enregistrer</button>
        </div>
      </div>

      <!-- AFFICHAGE DU PSEUDO ACTIF -->
      <div id="pseudoDisplay" class="pseudo-box" style="display:none;">
        <div class="pseudo-header">
          <span id="pseudoText" class="active-pseudo"></span>
          <button class="btn-edit" onclick="editPseudo()">✏️</button>
        </div>
        <!-- Informations de Ligue unifiées -->
        <div class="league-info-inline">
          <p id="leagueRank" class="rank-label"></p>
          <p id="leaguePoints" class="points-label"></p>
        </div>
      </div>
    </div>

    <!-- ACTIONS DE DÉCONNEXION -->
    <button class="btn-logout" onclick="logout()">Se déconnecter</button>
  </div>

  <!-- CARTE 2 : JEU ET HISTORIQUE (Droite ou Bas) -->
  <div class="profile-content-card">
    
    <!-- Lier compte Brawl Stars -->
    <div id="linkSection" class="game-link-section">
      <h3>Lier Brawl Stars</h3>
      <p class="section-desc">Connecte ton tag pour synchroniser tes matchs et multiplicateurs.</p>
      
      <div class="input-action-group">
        <input type="text" id="brawlTag" placeholder="#PLAYER_TAG">
        <button class="btn-link" onclick="linkBrawl()">Lier</button>
      </div>
      <p id="brawlResult"></p>
    </div>

    <!-- Affichage si déjà lié + Actualisation -->
    <div class="brawl-status-box">
      <p id="brawlSaved"></p>
      <button class="btn-refresh" onclick="refreshBrawlStats()">🔄 Actualiser mes stats</button>
    </div>

    <!-- Historique des gains -->
    <div class="profile-history-section">
      <h2>🏆 Historique des gains</h2>
      <div id="rewardsList" class="rewards-list-container">
        Chargement des récompenses...
      </div>
    </div>

  </div> <!-- Fin de profile-content-card -->

</div> <!-- Fin de profile-main-container -->

<!-- POPUP DE RANK UP (Fermé proprement ✅) -->
<div id="rankUpPopup" class="rankup-popup">
  <div class="rankup-content">
    <div class="rankup-title">✨ RANK UP ✨</div>
    <div id="rankUpText" class="rankup-text">SILVER → GOLD</div>
  </div>
</div>

<!-- SCRIPTS FIREBASE ET CONFIGURATION -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js"></script>

<script>
// ======================================================
// 🔐 SURVEILLANCE DE L'ÉTAT DE CONNEXION (AUTH)
// ======================================================
auth.onAuthStateChanged(async user => {
  if (!user) {
    window.location = "index.html";
    return;
  }

  // Affichage de l'email sécurisé
  const emailEl = document.getElementById("email");
  if (emailEl) emailEl.innerText = "📧 " + user.email;

  const doc = await db.collection("users").doc(user.uid).get();

  if (doc.exists) {
    const data = doc.data();

    // Initialisation des valeurs par défaut de la Ligue si manquantes
    if (data.leaguePoints === undefined) {
      await db.collection("users").doc(user.uid).set({
        leaguePoints: 0,
        leagueRank: "Bronze"
      }, { merge: true });

      data.leaguePoints = 0;
      data.leagueRank = "Bronze";
    }

    // Gestion de l'affichage du Pseudo et du Badge Créateur
    const pseudoTextEl = document.getElementById("pseudoText");
    const pseudoFormEl = document.getElementById("pseudoForm");
    const pseudoDisplayEl = document.getElementById("pseudoDisplay");

    if (data.pseudo) {
      if (pseudoTextEl) {
        const creatorBadge = data.isContentCreator ? " <span class='creator-badge'>Content Creator</span>" : "";
        pseudoTextEl.innerHTML = "🎮 Pseudo : " + data.pseudo + creatorBadge;
      }
      if (pseudoFormEl) pseudoFormEl.style.display = "none";
      if (pseudoDisplayEl) pseudoDisplayEl.style.display = "block";
    } else {
      if (pseudoFormEl) pseudoFormEl.style.display = "block";
      if (pseudoDisplayEl) pseudoDisplayEl.style.display = "none";
    }

    // Données financières et ligues
    const balanceEl = document.getElementById("balance");
    const rankEl = document.getElementById("leagueRank");
    const pointsEl = document.getElementById("leaguePoints");

    if (balanceEl) balanceEl.innerText = "💰 Solde : " + (data.balance || 0) + "€";
    if (rankEl) rankEl.innerText = "🏆 Rank : " + (data.leagueRank || "Bronze");
    if (pointsEl) pointsEl.innerText = "⭐ " + (data.leaguePoints || 0) + " LP";

    // Statut du compte Brawl Stars lié
    const brawlSavedEl = document.getElementById("brawlSaved");
    const linkSectionEl = document.getElementById("linkSection");

    if (data.brawlName && data.brawlTag) {
      if (brawlSavedEl) {
        brawlSavedEl.innerText = `🎮 ${data.brawlName} (${data.brawlTag}) | 🏆 ${data.brawlTrophies || 0}`;
      }
      if (linkSectionEl) linkSectionEl.style.display = "none";
    } else {
      if (brawlSavedEl) brawlSavedEl.innerText = "Aucun compte Brawl Stars lié.";
      if (linkSectionEl) linkSectionEl.style.display = "block";
    }
  }

  // Chargement de l'historique financier
  loadRewardsHistory(user);
});

// ======================================================
// 🏆 CHARGEMENT DE L'HISTORIQUE DES GAINS
// ======================================================
async function loadRewardsHistory(user) {
  const container = document.getElementById("rewardsList");
  if (!container) return;

  try {
    const snapshot = await db.collection("users")
      .doc(user.uid)
      .collection("rewards")
      .limit(10)
      .get();

    if (snapshot.empty) {
      container.innerHTML = `<p class="no-data">Aucun gain pour le moment.</p>`;
      return;
    }

    container.innerHTML = "";

    snapshot.forEach(doc => {
      const data = doc.data();
      const date = data.createdAt?.toDate
        ? data.createdAt.toDate().toLocaleDateString()
        : "Date inconnue";

      container.innerHTML += `
        <div class="reward-history-card">
          <div class="reward-info">
            <strong class="reward-amount">💰 +${data.amount}€</strong>
            <p class="reward-id">${data.tournamentId}</p>
          </div>
          <span class="reward-date">${date}</span>
        </div>
      `;
    });

  } catch (e) {
    console.error(e);
    container.innerHTML = `<p class="error-text">Erreur lors du chargement de l'historique.</p>`;
  }
}

// ======================================================
// 🚪 DÉCONNEXION
// ======================================================
function logout() {
  auth.signOut().then(() => window.location = "index.html");
}

// ======================================================
// 🔗 LIAISON COMPTE BRAWL STARS
// ======================================================
async function linkBrawl() {
  const inputEl = document.getElementById("brawlTag");
  const input = inputEl ? inputEl.value.trim() : "";

  if (!input) {
    alert("Entre ton tag !");
    return;
  }

  try {
    const cleanTag = input.startsWith("#") ? input : "#" + input;

    const res = await fetch(`https://cash-arena-api.onrender.com/api/brawl/player/${encodeURIComponent(cleanTag)}`);
    const data = await res.json();

    if (!res.ok || data.error) {
      alert("Erreur : " + (data.message || "Impossible de récupérer le compte"));
      return;
    }

    const brawlResultEl = document.getElementById("brawlResult");
    if (brawlResultEl) {
      brawlResultEl.innerText = `✅ ${data.name} | 🏆 ${data.trophies}`;
    }

    const user = auth.currentUser;

    await db.collection("users").doc(user.uid).update({
      brawlTag: data.tag,
      brawlName: data.name,
      brawlTrophies: data.trophies
    });

    const linkSectionEl = document.getElementById("linkSection");
    const brawlSavedEl = document.getElementById("brawlSaved");

    if (linkSectionEl) linkSectionEl.style.display = "none";
    if (brawlSavedEl) {
      brawlSavedEl.innerText = `🎮 ${data.name} (${data.tag}) | 🏆 ${data.trophies}`;
    }

  } catch (e) {
    console.error(e);
    alert("Erreur lors de la communication avec l'API.");
  }
}

// ======================================================
// 💾 ENREGISTREMENT ET CHANGEMENT DU PSEUDO (TRANSACTION)
// ======================================================
async function savePseudo() {
  const inputEl = document.getElementById("pseudoInput");
  const pseudo = inputEl ? inputEl.value.trim() : "";
  const user = auth.currentUser;

  if (!user) {
    alert("Connecte-toi !");
    return;
  }

  if (!pseudo) {
    alert("Entre un pseudo !");
    return;
  }

  if (pseudo.length < 3 || pseudo.length > 16) {
    alert("Le pseudo doit contenir entre 3 et 16 caractères !");
    return;
  }

  const pseudoKey = pseudo.toLowerCase();
  const usernameRef = db.collection("usernames").doc(pseudoKey);
  const userRef = db.collection("users").doc(user.uid);

  try {
    let isCreator = false;

    await db.runTransaction(async transaction => {
      const usernameDoc = await transaction.get(usernameRef);
      const userDoc = await transaction.get(userRef);

      if (userDoc.exists) {
        isCreator = userDoc.data().isContentCreator || false;
      }

      const oldPseudoKey = userDoc.exists && userDoc.data().pseudoKey
        ? userDoc.data().pseudoKey
        : null;

      if (usernameDoc.exists && usernameDoc.data().uid !== user.uid) {
        throw new Error("PSEUDO_TAKEN");
      }

      if (oldPseudoKey && oldPseudoKey !== pseudoKey) {
        transaction.delete(db.collection("usernames").doc(oldPseudoKey));
      }

      transaction.set(usernameRef, {
        uid: user.uid,
        pseudo: pseudo,
        createdAt: new Date()
      });

      transaction.update(userRef, {
        pseudo: pseudo,
        pseudoKey: pseudoKey,
        pseudoUpdatedAt: new Date()
      });
    });

    const pseudoTextEl = document.getElementById("pseudoText");
    const pseudoFormEl = document.getElementById("pseudoForm");
    const pseudoDisplayEl = document.getElementById("pseudoDisplay");

    if (pseudoTextEl) {
      const creatorBadge = isCreator ? " <span class='creator-badge'>Content Creator</span>" : "";
      pseudoTextEl.innerHTML = "🎮 Pseudo : " + pseudo + creatorBadge;
    }

    if (pseudoFormEl) pseudoFormEl.style.display = "none";
    if (pseudoDisplayEl) pseudoDisplayEl.style.display = "block";

    alert("Pseudo enregistré avec succès !");
  } catch (e) {
    if (e.message === "PSEUDO_TAKEN") {
      alert("Ce pseudo est déjà pris par un autre joueur !");
    } else {
      console.error(e);
      alert("Erreur lors de l'enregistrement du pseudo.");
    }
  }
}

// ======================================================
// ✏️ ÉDITION DU PSEUDO
// ======================================================
function editPseudo() {
  const pseudoFormEl = document.getElementById("pseudoForm");
  const pseudoDisplayEl = document.getElementById("pseudoDisplay");

  if (pseudoFormEl) pseudoFormEl.style.display = "block";
  if (pseudoDisplayEl) pseudoDisplayEl.style.display = "none";
}

// ======================================================
// 🔄 ACTUALISATION DES STATISTIQUES BRAWL STARS
// ======================================================
async function refreshBrawlStats() {
  const user = auth.currentUser;

  if (!user) {
    alert("Connecte-toi !");
    return;
  }

  const userDoc = await db.collection("users").doc(user.uid).get();
  
  if (!userDoc.exists) {
    alert("Données utilisateur introuvables.");
    return;
  }
  
  const userData = userDoc.data();

  if (!userData.brawlTag) {
    alert("Aucun compte Brawl Stars lié.");
    return;
  }

  try {
    const res = await fetch(`https://cash-arena-api.onrender.com/api/brawl/player/${encodeURIComponent(userData.brawlTag)}`);
    const data = await res.json();

    if (!res.ok || data.error) {
      alert("Erreur lors de la synchronisation avec l'API Brawl Stars.");
      return;
    }

    // Sauvegarde enrichie des données dans Firestore
    await db.collection("users").doc(user.uid).update({
      brawlName: data.name,
      brawlTrophies: data.trophies,
      brawlHighestTrophies: data.highestTrophies || 0,
      brawlExpLevel: data.expLevel || 0,
      brawlClubName: data.club?.name || "",
      brawlUpdatedAt: new Date()
    });

    const brawlSavedEl = document.getElementById("brawlSaved");
    if (brawlSavedEl) {
      brawlSavedEl.innerText = `🎮 ${data.name} (${data.tag}) | 🏆 ${data.trophies}`;
    }

    alert("Statistiques Brawl Stars synchronisées avec succès !");
  } catch (e) {
    console.error(e);
    alert("Erreur serveur lors de l'actualisation.");
  }
}

// ======================================================
// 🏠 REDIRECTION VERS L'ACCUEIL
// ======================================================
function goHome() {
  window.location.href = "index.html";
}
</script>

<!-- Script d'analyses de performance Vercel -->
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

</body>
</html>
