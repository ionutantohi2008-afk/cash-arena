<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Arena • Teams Dashboard</title>
    <link rel="stylesheet" href="teams.css">
    <style>
        .dashboard-container {
            width: min(1200px, calc(100% - 40px));
            margin: 40px auto 80px;
            text-align: center;
        }
        .header-section h1 {
            font-size: clamp(36px, 5vw, 62px);
            font-weight: 950;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin: 0;
            color: #ffffff;
        }
        .season-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 16px;
            background: linear-gradient(90deg, #ffd000, #ff8a00);
            color: #000;
            font-weight: 900;
            border-radius: 20px;
            font-size: 14px;
            text-transform: uppercase;
        }
        .timer-box {
            margin: 25px auto;
            padding: 15px 30px;
            background: rgba(13, 17, 27, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            display: inline-flex;
            flex-direction: column;
            gap: 5px;
            backdrop-filter: blur(10px);
        }
        .timer-label {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }
        .timer-countdown {
            font-size: 24px;
            font-weight: 900;
            color: #ffd000;
            letter-spacing: 1px;
        }
        /* Style Tableau Classement Ultra Propre */
        .leaderboard-table-wrapper {
            background: rgba(10, 12, 20, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            margin-top: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .leaderboard-table th {
            background: rgba(255, 255, 255, 0.02);
            padding: 18px 24px;
            font-size: 12px;
            font-weight: 800;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .leaderboard-table td {
            padding: 18px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 14px;
            font-weight: 700;
        }
        .row-podium-1 { background: linear-gradient(90deg, rgba(255, 208, 0, 0.06), transparent); }
        .row-podium-2 { background: linear-gradient(90deg, rgba(192, 192, 192, 0.04), transparent); }
        .row-podium-3 { background: linear-gradient(90deg, rgba(205, 127, 50, 0.04), transparent); }
        
        .rank-tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: 900;
        }
        .rank-1 { background: #ffd000; color: #000; }
        .rank-2 { background: #cccccc; color: #000; }
        .rank-3 { background: #cd7f32; color: #000; }
        
        .reward-badge {
            padding: 4px 10px;
            background: rgba(80, 220, 130, 0.15);
            border: 1px solid rgba(80, 220, 130, 0.3);
            color: #65e89a;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="gaming-bg"></div>
    <div class="gaming-grid"></div>

    <div class="dashboard-container">
        <div class="header-section">
            <h1>Teams Dashboard</h1>
            <div class="season-badge">Saison 1</div>
        </div>

        <div class="timer-box">
            <span class="timer-label">Prochaine saison</span>
            <div class="timer-countdown" id="seasonTimer">Chargement...</div>
        </div>

        <div class="leaderboard-table-wrapper">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">Rang</th>
                        <th>Équipe</th>
                        <th style="width: 150px;">Membres</th>
                        <th style="width: 150px;">Score Cumulé</th>
                        <th style="width: 150px;">Récompense</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Généré par le JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Intégration de Firebase requis (Ajuster selon vos versions et imports globaux) -->
    <script id="dashboardScript">
        // Remplacer par la date ciblée de la Prochaine Saison
        const TARGET_DATE = new Date("2026-10-30T20:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const diff = TARGET_DATE - now;
            if(diff <= 0) {
                document.getElementById("seasonTimer").innerText = "SAISON TERMINÉE !";
                return;
            }
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById("seasonTimer").innerText = `${days}j ${hours}h ${minutes}m ${seconds}s`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

    async function fetchLeaderboard() {
    try {
        const response = await fetch("https://votre-api-backend.com");
        const resData = await response.json();
        if(!resData.success) return;

        const tbody = document.getElementById("leaderboardBody");
        tbody.innerHTML = "";

        resData.leaderboard.forEach(team => {
            let podiumClass = "";
            let rankDisplay = `<span class="rank-tag">${team.rank}</span>`;
            let rewardBadge = team.reward !== "-" ? `<span class="reward-badge">💰 ${team.reward}</span>` : "-";

            if(team.rank === 1) { podiumClass = "row-podium-1"; rankDisplay = `<span class="rank-tag rank-1">1</span>`; }
            else if(team.rank === 2) { podiumClass = "row-podium-2"; rankDisplay = `<span class="rank-tag rank-2">2</span>`; }
            else if(team.rank === 3) { podiumClass = "row-podium-3"; rankDisplay = `<span class="rank-tag rank-3">3</span>`; }

            const row = `
                <tr class="${podiumClass}">
                    <td>${rankDisplay}</td>
                    <td><strong style="color:#fff;">${team.name}</strong></td>
                    <td>👥 ${team.membersCount} membres</td>
                    <td style="color:#ffd000; font-weight:900;">${team.points} pts</td>
                    <td>${rewardBadge}</td>
                </tr>
            `;
            tbody.insertAdjacentHTML("beforeend", row);
        });
    } catch(err) {
        console.error("Erreur affichage classement :", err);
    }
}
document.addEventListener("DOMContentLoaded", fetchLeaderboard);
</script>

</body>
</html>
