<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Arena • Teams Dashboard</title>
    <link rel="stylesheet" href="team-dashboard.css">
</head>
<body>
    <div class="gaming-bg"></div>

    <div class="dashboard-container">
        <div class="header-section">
            <h1>Teams Dashboard</h1>
            <div class="season-title">Saison 1</div>
        </div>

        <!-- Section du compteur technologique -->
        <div class="timer-section-box">
            <div class="timer-title">Prochaine saison</div>
            <div class="timer-hexagon-container">
                <div class="timer-segment">
                    <span class="timer-number" id="t-days">00</span>
                    <span class="timer-sublabel">Jours</span>
                </div>
                <div class="timer-segment">
                    <span class="timer-number" id="t-hours">00</span>
                    <span class="timer-sublabel">Heures</span>
                </div>
                <div class="timer-segment">
                    <span class="timer-number" id="t-mins">00</span>
                    <span class="timer-sublabel">Minutes</span>
                </div>
                <div class="timer-segment">
                    <span class="timer-number" id="t-secs">00</span>
                    <span class="timer-sublabel">Secondes</span>
                </div>
            </div>
        </div>

        <!-- Tableau des Équipes -->
        <div class="leaderboard-table-wrapper">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th style="width: 100px;">Rang</th>
                        <th>Équipe</th>
                        <th style="width: 180px;">Membres</th>
                        <th style="width: 180px;">Score Cumulé</th>
                        <th style="width: 180px;">Récompense</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Données injectées en JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Mettre à jour l'instant de fin de saison (Format: AAAA-MM-JJTHH:mm:ss)
        const TARGET_DATE = new Date("2026-10-30T20:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const diff = TARGET_DATE - now;
            
            if(diff <= 0) {
                document.getElementById("t-days").innerText = "00";
                document.getElementById("t-hours").innerText = "00";
                document.getElementById("t-mins").innerText = "00";
                document.getElementById("t-secs").innerText = "00";
                return;
            }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById("t-days").innerText = String(days).padStart(2, '0');
            document.getElementById("t-hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("t-mins").innerText = String(minutes).padStart(2, '0');
            document.getElementById("t-secs").innerText = String(seconds).padStart(2, '0');
        }
        
        setInterval(updateTimer, 1000);
        updateTimer();

        // Récupération des données depuis Render
        async function fetchLeaderboard() {
            const tbody = document.getElementById("leaderboardBody");
            if (!tbody) return;

            try {
                const BACKEND_URL = "https://onrender.com";
                const response = await fetch(`${BACKEND_URL}/api/teams/leaderboard`);
                
                if (!response.ok) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#ff4646;">⚠️ Erreur de liaison serveur</td></tr>`;
                    return;
                }

                const resData = await response.json();
                if(!resData.success || !resData.leaderboard) return;

                tbody.innerHTML = "";

                resData.leaderboard.forEach(team => {
                    let podiumClass = "";
                    let rewardDisplay = `<span class="reward-none">—</span>`;

                    if(team.rank === 1) {
                        podiumClass = "row-podium-1";
                        rewardDisplay = `<span class="reward-display-badge">💵 ${team.reward}</span>`;
                    } else if(team.rank === 2) {
                        podiumClass = "row-podium-2";
                        rewardDisplay = `<span class="reward-display-badge">🎁 ${team.reward}</span>`;
                    } else if(team.rank === 3) {
                        podiumClass = "row-podium-3";
                        rewardDisplay = `<span class="reward-display-badge">🎁 ${team.reward}</span>`;
                    }

                    const row = `
                        <tr class="${podiumClass}">
                            <td><div class="rank-badge-box">${team.rank}</div></td>
                            <td><span class="team-name-text">${team.name}</span></td>
                            <td>👥 ${team.membersCount} membres</td>
                            <td><span class="score-text">⭐ ${team.points.toLocaleString()}</span></td>
                            <td>${rewardDisplay}</td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML("beforeend", row);
                });
            } catch(err) {
                console.error("Erreur :", err);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#ff4646;">❌ Serveur injoignable</td></tr>`;
            }
        }
        document.addEventListener("DOMContentLoaded", fetchLeaderboard);
    </script>
</body>
</html>
