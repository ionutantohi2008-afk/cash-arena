<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Arena • Teams Dashboard</title>
    <link rel="stylesheet" href="team-dashboard.css">
</head>
<body>
    <div class="gaming-bg"></div>
    <div class="gaming-grid"></div>
    <div class="gaming-glow"></div>

    <div class="dashboard-container">
        <div class="header-section">
            <h1>Teams Dashboard</h1>
            <div class="season-badge">Saison 1</div>
        </div>

        <div class="timer-box">
            <span class="timer-label">Prochaine saison</span>
            <div class="timer-countdown" id="seasonTimer">Chargement...</div>
        </div>

        <!-- 🏆 PODIUM GRAPHIQUE EN 3D SÉCURISÉ -->
        <div class="podium-visual" id="podiumVisualContainer" style="display: none;">
            <!-- Rempli en JS par le Top 3 -->
        </div>

        <!-- TABLEAU DE TOUTES LES ÉQUIPES -->
        <div class="leaderboard-table-wrapper">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">Rang</th>
                        <th>Équipe</th>
                        <th style="width: 160px;">Membres</th>
                        <th style="width: 160px;">Score Cumulé</th>
                        <th style="width: 160px;">Récompense</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Rempli en JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Configuration de la fin de saison (Format: AAAA-MM-JJTHH:mm:ss)
        const TARGET_DATE = new Date("2026-10-30T20:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const diff = TARGET_DATE - now;
            if(diff <= 0) {
                document.getElementById("seasonTimer").innerText = "SAISON TERMINÉE !";
                return;
            }
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById("seasonTimer").innerText = `${days}j ${hours}h ${minutes}m ${seconds}s`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // Chargement du classement complet
        async function fetchLeaderboard() {
            const tbody = document.getElementById("leaderboardBody");
            const podiumContainer = document.getElementById("podiumVisualContainer");
            if (!tbody) return;

            try {
                const BACKEND_URL = "https://onrender.com";
                const response = await fetch(`${BACKEND_URL}/api/teams/leaderboard`);
                
                if (!response.ok) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#ff4646;">⚠️ Erreur Serveur</td></tr>`;
                    return;
                }

                const resData = await response.json();
                if(!resData.success || !resData.leaderboard || resData.leaderboard.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b;">👥 Aucune équipe dans cette saison.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                podiumContainer.innerHTML = "";
                let top3 = {1: null, 2: null, 3: null};

                resData.leaderboard.forEach(team => {
                    // Collecte pour le podium graphique
                    if (team.rank <= 3) {
                        top3[team.rank] = team;
                    }

                    let podiumClass = "";
                    if(team.rank === 1) podiumClass = "row-podium-1";
                    else if(team.rank === 2) podiumClass = "row-podium-2";
                    else if(team.rank === 3) podiumClass = "row-podium-3";

                    let rewardBadge = team.reward !== "-" ? `<span class="reward-badge">💰 ${team.reward}</span>` : "-";

                    const row = `
                        <tr class="${podiumClass}">
                            <td><span class="rank-tag">${team.rank}</span></td>
                            <td><strong style="color:#ffffff;">${team.name}</strong></td>
                            <td>👥 ${team.membersCount} membres</td>
                            <td style="color:#ffd000; font-weight:900;">${team.points} pts</td>
                            <td>${rewardBadge}</td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML("beforeend", row);
                });

                // Génération visuelle des boîtes 3D du Podium s'il y a des équipes
                if (top3[1]) {
                    podiumContainer.style.display = "flex";
                    
                    // Box 1er
                    let p1Html = `<div class="podium-card p-1"><div class="podium-badge">👑</div><div class="team-name">${top3[1].name}</div><div class="team-pts">${top3[1].points} pts</div></div>`;
                    podiumContainer.insertAdjacentHTML("beforeend", p1Html);

                    // Box 2e (si présent)
                    if (top3[2]) {
                        let p2Html = `<div class="podium-card p-2"><div class="podium-badge">2</div><div class="team-name">${top3[2].name}</div><div class="team-pts">${top3[2].points} pts</div></div>`;
                        podiumContainer.insertAdjacentHTML("beforeend", p2Html);
                    }
                    // Box 3e (si présent)
                    if (top3[3]) {
                        let p3Html = `<div class="podium-card p-3"><div class="podium-badge">3</div><div class="team-name">${top3[3].name}</div><div class="team-pts">${top3[3].points} pts</div></div>`;
                        podiumContainer.insertAdjacentHTML("beforeend", p3Html);
                    }
                }

            } catch(err) {
                console.error("Erreur :", err);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#ff4646;">❌ Échec de la connexion</td></tr>`;
            }
        }
        document.addEventListener("DOMContentLoaded", fetchLeaderboard);
    </script>
</body>
</html>
