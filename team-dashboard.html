<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Arena • Teams Dashboard</title>
    <!-- On lie uniquement le nouveau fichier CSS isolé -->
    <link rel="stylesheet" href="team-dashboard.css">
</head>
<body>

    <!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar">

<a href="index.html" class="logo">
⚡ Cash Arena
</a>

<div class="nav-links">
<a href="index.html">Accueil</a>
<a href="dashboard.html">Tournois</a>
<a href="league.html" class="active">League</a>
<a href="teams.html">Équipes</a>
</div>

<div id="authSection"></div>

</nav>

    <!-- Les couches de background gérées par le CSS -->
    <div class="gaming-bg"></div>
    <div class="gaming-grid"></div>
    <div class="gaming-glow"></div>

    <div class="dashboard-container">
        <div class="header-section">
            <h1>Teams Dashboard</h1>
            <div class="season-badge">Saison 1</div>
        </div>

        <div class="timer-box">
            <span class="timer-label">Prochaine saison</span>
            <div class="timer-countdown" id="seasonTimer">Chargement...</div>
        </div>

        <div class="leaderboard-table-wrapper">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">Rang</th>
                        <th>Équipe</th>
                        <th style="width: 160px;">Membres</th>
                        <th style="width: 160px;">Score Cumulé</th>
                        <th style="width: 160px;">Récompense</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Les lignes seront générées ici par ton JS -->
                </tbody>
            </table>
        </div>
    </div>

        <!-- Script de gestion du minuteur et récupération du classement -->
    <script>
        // Règle ici la date de fin de la saison (Format: AAAA-MM-JJTHH:mm:ss)
        const TARGET_DATE = new Date("2026-10-30T20:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const diff = TARGET_DATE - now;
            
            if(diff <= 0) {
                document.getElementById("seasonTimer").innerText = "SAISON TERMINÉE !";
                return;
            }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById("seasonTimer").innerText = `${days}j ${hours}h ${minutes}m ${seconds}s`;
        }
        
        setInterval(updateTimer, 1000);
        updateTimer();

        // Script d'affichage des données ultra-sécurisé
        async function fetchLeaderboard() {
            const tbody = document.getElementById("leaderboardBody");
            if (!tbody) {
                console.error("Erreur critique : L'élément HTML 'leaderboardBody' est introuvable dans la page !");
                return;
            }

            try {
                const BACKEND_URL = "https://cash-arena-api.onrender.com";
                console.log("📡 Envoi de la requête à :", `${BACKEND_URL}/api/teams/leaderboard`);
                
                const response = await fetch(`${BACKEND_URL}/api/teams/leaderboard`);
                
                if (!response.ok) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#ff4646;">⚠️ Erreur Serveur (Statut ${response.status})</td></tr>`;
                    throw new Error(`Erreur HTTP : statut ${response.status}`);
                }

                const resData = await response.json();
                console.log("📥 Données reçues du serveur :", resData);

                if(!resData.success || !resData.leaderboard) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#ff4646;">⚠️ Le serveur n'a renvoyé aucune équipe valide.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";

                if (resData.leaderboard.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#aeb5c4;">👥 Aucune équipe enregistrée pour le moment.</td></tr>`;
                    return;
                }

                resData.leaderboard.forEach(team => {
                    let podiumClass = "";
                    let rankDisplay = `<span class="rank-tag">${team.rank}</span>`;
                    let rewardBadge = team.reward !== "-" ? `<span class="reward-badge">💰 ${team.reward}</span>` : "-";

                    if(team.rank === 1) { podiumClass = "row-podium-1"; rankDisplay = `<span class="rank-tag rank-1">1</span>`; }
                    else if(team.rank === 2) { podiumClass = "row-podium-2"; rankDisplay = `<span class="rank-tag rank-2">2</span>`; }
                    else if(team.rank === 3) { podiumClass = "row-podium-3"; rankDisplay = `<span class="rank-tag rank-3">3</span>`; }

                    const row = `
                        <tr class="${podiumClass}">
                            <td>${rankDisplay}</td>
                            <td><strong style="color:#ffffff;">${team.name || 'Équipe sans nom'}</strong></td>
                            <td>👥 ${team.membersCount || 0} membres</td>
                            <td style="color:#ffd000; font-weight:900;">${team.points || 0} pts</td>
                            <td>${rewardBadge}</td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML("beforeend", row);
                });
                
                console.log("✅ Injection HTML réussie pour toutes les équipes !");

            } catch(err) {
                console.error("Erreur affichage classement :", err);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#ff4646;">❌ Impossible de charger les données : ${err.message}</td></tr>`;
            }
        }
        
        document.addEventListener("DOMContentLoaded", fetchLeaderboard);
    </script>

</body>
</html>
